          "totalTime": "PT1M",
          "step": [
            { "@type": "HowToStep", "position": 1, "name": "Open ShareTexts on both devices", "text": "Open sharetexts.online in a browser on both devices. No app, no account, nothing to install." },
            { "@type": "HowToStep", "position": 2, "name": "Connect the two devices", "text": "Tap your other device in the Nearby list when it appears — or use a six-digit code, scan a QR code, or open a share link." },

          ]
        },
        {

          }
        },
        {
          "@type": "WebApplication",

          "url": "https://sharetexts.online/",

          "applicationCategory": "UtilitiesApplication",

          "browserRequirements": "Requires a supported browser and an internet connection",
          "isAccessibleForFree": true,
          "inLanguage": ["en", "de", "fr", "es", "pt", "hi", "ja", "zh", "ar"],
          "image": "https://sharetexts.online/og/airdrop-any-device.png?v=17",
          "screenshot": "https://sharetexts.online/og/airdrop-any-device.png?v=17",
          "featureList": [
            "Nearby device discovery while ShareTexts is open on your other device",
            "Six-digit live pairing code",
            "QR code pairing",

            "Transfer text, links, photos, videos, audio, and any file",
            "End-to-end encrypted peer-to-peer transfers",
            "Works between iPhone, Android, Windows, macOS, and Linux"
          ],
          "offers": {

            "price": "0",

          },

    <!-- FAQPage markup — kept for content clarity; Google limits rich results to
         authoritative government/health sites, so this is not a ranking lever. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I move text between two devices?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open ShareTexts on both devices. On the first device, tap Send and share the six-digit code. Enter the code on the second device, then paste or type anything — it appears on the other device, encrypted."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to install an app or create an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. ShareTexts runs in the browser — no app, no account, no installation. It works between an iPhone and a Windows PC, or any two devices with a browser."
          }
        },
        {
          "@type": "Question",
          "name": "Can I send photos and files, not just text?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. ShareTexts transfers text, links, photos, videos, audio, and files between your devices. Tested transfer sizes vary by browser and connection."
          }
        },
        {
          "@type": "Question",
          "name": "Why can't I see my other device in the Nearby list?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your other device appears in the Nearby list when ShareTexts is open on it with Nearby visibility turned on; discovery needs a working internet connection on both devices. If nothing appears, connect with a six-digit code, a QR code, or a share link instead — these work over any internet connection."
          }
        },
        {
          "@type": "Question",
          "name": "How do I transfer files from an iPhone to a Windows PC without an app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open sharetexts.online in a browser on the iPhone and on the Windows PC. Connect them — via the Nearby list, a six-digit code, a QR code, or a link — then attach the files and send. The transfer goes directly between the two devices, encrypted, with no app or account required."
          }
        },
        {
          "@type": "Question",
          "name": "Is ShareTexts private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Transfers are encrypted between devices. ShareTexts keeps no account, no permanent chat history, and no copies of your content. Temporary rooms close automatically."
          }
        },
        {
          "@type": "Question",
          "name": "Is ShareTexts safe to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Every transfer is end-to-end encrypted between the two devices with WebRTC (DTLS) plus an additional AES-GCM layer, rooms are protected by a 128-bit secret, and nothing you send is stored on the server. Only someone with your code, QR, or link can join your room."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use ShareTexts between an iPhone and an Android phone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. ShareTexts works between any two devices with a browser — iPhone to Android, Android to Windows, iPhone to Mac, anything else. It is a cross-platform AirDrop alternative that runs entirely in the browser."
          }
        },
        {
          "@type": "Question",
          "name": "Can I keep a room open between my devices?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — turn on Stay Connected inside the room. The room stays alive until you disconnect it yourself, rejoining is one tap from the landing page, and reconnects after a refresh or network drop happen automatically."
          }
        }
      ]
    }
    </script>
    <!-- Apply the saved theme before first paint (no flash): default to the
         system preference; a manual choice in localStorage wins. The same
         logic lives in src/lib/theme.ts for runtime changes. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('sharetext.theme');
          var dark = v === 'dark' || (v !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? '#131315' : '#f7f4ee';
        } catch (e) { /* storage unavailable — system default applies */ }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f3f0;color:#1d1d1f">
          <div style="text-align:center;padding:2rem">
            <svg width="40" height="40" viewBox="0 0 256 256" fill="none" style="margin-bottom:1rem">
              <rect x="40" y="36" width="84" height="84" rx="24" fill="currentColor"/><rect x="132" y="136" width="84" height="84" rx="24" fill="currentColor"/><path d="M110 106 L146 142" stroke="currentColor" stroke-width="28" stroke-linecap="round"/>
            </svg>
            <p style="font-size:16px;font-weight:600;margin:0 0 8px">ShareTexts requires JavaScript.</p>
            <p style="font-size:14px;color:#6e6e73;margin:0">Please enable JavaScript in your browser settings.</p>
          </div>
        </div>
      </noscript>
      <!-- Boot skeleton: the app holding the user's place, not an animation.
           Mirrors the REAL landing composition — brand lockup top-left, hero
           (headline → subline → action pair) on the left, the product scene
           card on the right, warm paper canvas — so the swap to live content
           moves nothing. NO bright white sweep: the old 55%-white shimmer
           band read as a bold white outline crawling the page. Bars carry a
           barely-there ember-tinted breath instead; reduced-motion holds
           them still. -->
      <div id="loading-shell" aria-hidden="true">
        <style>
          #loading-shell {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #f7f4ee;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            transition: opacity 0.24s cubic-bezier(0.22, 1, 0.36, 1);
          }
          #loading-shell.fade-out { opacity: 0; }
          html.dark #loading-shell { background: #131315; }
          #loading-shell .st-bar {
            border-radius: 999px;
            background: rgba(30, 28, 24, 0.075);
            position: relative;
            overflow: hidden;
          }
          html.dark #loading-shell .st-bar { background: rgba(255, 255, 255, 0.075); }
          #loading-shell .st-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            transform: translateX(-101%);
            /* Warm, whisper-quiet breath — ember at 5%: the page feels alive
               without a white band sweeping across it. */
            background: linear-gradient(90deg, transparent, rgba(240,100,19,0.07) 50%, transparent);
            animation: st-sweep 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
          }
          #loading-shell .st-card {
            border-radius: 24px;
            border: 1px solid rgba(30, 28, 24, 0.07);
            background: rgba(255, 254, 251, 0.75);
            position: relative;
            overflow: hidden;
          }
          html.dark #loading-shell .st-card {
            border-color: rgba(255, 255, 255, 0.07);
            background: rgba(255, 255, 255, 0.035);
          }
          @keyframes st-sweep { to { transform: translateX(101%); } }
          @media (prefers-reduced-motion: reduce) {
            #loading-shell .st-bar::after { animation: none; content: none; }
          }
          @media (max-width: 900px) {
            #loading-shell .st-hero { grid-template-columns: 1fr !important; }
            /* The live demo collapses to the phone alone on phones, so the
               placeholder does the same: same shape, same place, no jump. */
            #loading-shell .st-scene { width: 168px !important; height: 360px !important; margin: 0 auto; }
            #loading-shell .st-lap { display: none !important; }
            #loading-shell .st-phone {
              position: absolute !important;
              inset: 0 !important;
              width: 100% !important;
              height: 100% !important;
            }
          }
        </style>
        <!-- Header band: the real brand mark (inline, ember gradient) where
             the live header will sit. -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 28px">
          <div style="display:flex;align-items:center;gap:8px">
            <svg width="30" height="30" viewBox="0 0 256 256" fill="none" aria-hidden="true">
              <defs><linearGradient id="st-boot-ember" x1="24" y1="20" x2="216" y2="236" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#feab30"/><stop offset="0.55" stop-color="#f97b3d"/><stop offset="1" stop-color="#f06413"/>
              </linearGradient></defs>
              <rect x="40" y="36" width="84" height="84" rx="24" fill="url(#st-boot-ember)"/>
              <rect x="132" y="136" width="84" height="84" rx="24" fill="url(#st-boot-ember)"/>
              <path d="M110 106 L146 142" stroke="url(#st-boot-ember)" stroke-width="28" stroke-linecap="round"/>
            </svg>
            <span style="font-size:21px;font-weight:700;letter-spacing:-0.02em;color:#1e1c18">ShareTexts</span>
          </div>
          <div class="st-bar" style="width:56px;height:26px;border-radius:13px"></div>
        </div>
        <!-- Hero: the landing's real geometry. -->
        <div class="st-hero" style="flex:1;display:grid;grid-template-columns:minmax(0,10fr) minmax(0,9fr);align-items:center;gap:40px;width:100%;max-width:1120px;margin:0 auto;padding:0 28px">
          <div style="max-width:430px">
            <div class="st-bar" style="width:88%;height:40px;border-radius:16px;margin-bottom:12px"></div>
            <div class="st-bar" style="width:70%;height:40px;border-radius:16px;margin-bottom:20px"></div>
            <div class="st-bar" style="width:62%;height:16px;margin-bottom:9px"></div>
            <div class="st-bar" style="width:48%;height:16px;margin-bottom:30px"></div>
            <div style="display:flex;gap:12px">
              <div class="st-bar" style="width:138px;height:52px;border-radius:999px;background:linear-gradient(180deg, rgba(240,100,19,0.32), rgba(240,100,19,0.20))"></div>
              <div class="st-bar" style="width:138px;height:52px;border-radius:999px"></div>
            </div>
            <div class="st-bar" style="width:55%;height:13px;margin-top:26px"></div>
          </div>
          <!-- The scene placeholder is the demo's own silhouette: a wide
               laptop block with a phone standing in front of its right
               corner. Same shapes, same places as the live component, so the
               swap lands without the eye catching a rearrangement. -->
          <div class="st-scene" style="position:relative;height:min(46vh,330px)">
            <div class="st-bar st-lap" style="position:absolute;left:0;top:1%;width:68%;height:75%;border-radius:13px;opacity:0.55"></div>
            <div class="st-bar st-lap" style="position:absolute;left:1%;top:78%;width:67%;height:9px;border-radius:6px;opacity:0.4"></div>
            <div class="st-bar st-phone" style="position:absolute;right:7%;bottom:0;width:19%;height:88%;border-radius:16px;opacity:0.75"></div>
          </div>
        </div>
        <!-- The honest escalation (mirrors the in-app connecting screen):
             an 8s boot is NOT normal — say so instead of shimmering forever.
             Removed by main.tsx with the shell; never shown on a healthy boot. -->
        <p id="st-boot-slow" style="display:none;margin:0 0 22px;padding:0 24px;font-size:12.5px;font-weight:500;color:#6e6e73;text-align:center;line-height:1.5">
          Still loading — your connection is slow. If this doesn't clear, check your network and refresh.
        </p>
      </div>
      <script>
        (function () {
          try {
            setTimeout(function () {
              var el = document.getElementById('st-boot-slow');
              if (el && document.getElementById('loading-shell')) el.style.display = 'block';
            }, 8000);
          } catch (e) { /* never block boot */ }
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
