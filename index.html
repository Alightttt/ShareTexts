    <!-- FAQPage markup — kept for content clarity; Google limits rich results to
         authoritative government/health sites, so this is not a ranking lever. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I move text between two devices?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open ShareTexts on both devices. On the first device, tap Send and share the six-digit code. Enter the code on the second device, then paste or type anything — it appears on the other device, encrypted."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to install an app or create an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. ShareTexts runs in the browser — no app, no account, no installation. It works between an iPhone and a Windows PC, or any two devices with a browser."
          }
        },
        {
          "@type": "Question",
          "name": "Can I send photos and files, not just text?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. ShareTexts transfers text, links, photos, videos, audio, and files between your devices. Tested transfer sizes vary by browser and connection."
          }
        },
        {
          "@type": "Question",
          "name": "Why can't I see my other device in the Nearby list?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Both devices must be on the same Wi-Fi network with ShareTexts open in a browser. Some networks — office, guest, hotel, and campus Wi-Fi — block device-to-device connections. If nothing appears, turn on a personal hotspot on one device and join it from the other, or connect with a six-digit code, a QR code, or a share link instead — these work over any internet connection."
          }
        },
        {
          "@type": "Question",
          "name": "How do I transfer files from an iPhone to a Windows PC without an app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open sharetexts.online in a browser on the iPhone and on the Windows PC. Connect them — via the Nearby list, a six-digit code, a QR code, or a link — then attach the files and send. The transfer goes directly between the two devices, encrypted, with no app or account required."
          }
        },
        {
          "@type": "Question",
          "name": "Is ShareTexts private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Transfers are encrypted between devices. ShareTexts keeps no account, no permanent chat history, and no copies of your content. Temporary rooms close automatically."
          }
        },
        {
          "@type": "Question",
          "name": "Is ShareTexts safe to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Every transfer is end-to-end encrypted between the two devices with WebRTC (DTLS) plus an additional AES-GCM layer, rooms are protected by a 128-bit secret, and nothing you send is stored on the server. Only someone with your code, QR, or link can join your room."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use ShareTexts between an iPhone and an Android phone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. ShareTexts works between any two devices with a browser — iPhone to Android, Android to Windows, iPhone to Mac, anything else. It is a cross-platform AirDrop alternative that runs entirely in the browser."
          }
        },
        {
          "@type": "Question",
          "name": "Can I keep a room open between my devices?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — turn on Stay Connected inside the room. The room stays alive until you disconnect it yourself, rejoining is one tap from the landing page, and reconnects after a refresh or network drop happen automatically."
          }
        }
      ]
    }
    </script>
    <!-- Apply the saved theme before first paint (no flash): default to the
         system preference; a manual choice in localStorage wins. The same
         logic lives in src/lib/theme.ts for runtime changes. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('sharetext.theme');
          var dark = v === 'dark' || (v !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? '#131315' : '#f7f4ee';
        } catch (e) { /* storage unavailable — system default applies */ }
      })();
    </script>

  <body>
    <div id="root">
      <noscript>
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f3f0;color:#1d1d1f">
          <div style="text-align:center;padding:2rem">
            <svg width="40" height="40" viewBox="0 0 256 256" fill="none" style="margin-bottom:1rem">
              <rect x="40" y="36" width="84" height="84" rx="24" fill="currentColor"/><rect x="132" y="136" width="84" height="84" rx="24" fill="currentColor"/><path d="M110 106 L146 142" stroke="currentColor" stroke-width="28" stroke-linecap="round"/>
            </svg>
            <p style="font-size:16px;font-weight:600;margin:0 0 8px">ShareTexts requires JavaScript.</p>
            <p style="font-size:14px;color:#6e6e73;margin:0">Please enable JavaScript in your browser settings.</p>
          </div>
        </div>
      </noscript>
      <div id="loading-shell" style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;transition:opacity 0.24s cubic-bezier(0.22,1,0.36,1)">
        <style>
          #loading-shell { opacity: 1; }
          #loading-shell.fade-out { opacity: 0; }
          /* One synchronized liquid cycle: the mark breathes while a single
             soft highlight slides across mark and wordmark together. Slow
             enough to read as calm, fast enough to never feel like waiting. */
          .st-logo-breathe { animation: st-breathe 2.6s cubic-bezier(0.4,0,0.2,1) infinite; }
          @keyframes st-breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.035)} }
          @keyframes st-shine { 0% { background-position: 135% 0; } 55%,100% { background-position: -135% 0; } }
          html.dark #loading-shell .st-boot-mark { color: #fb9243; }
          /* Liquid shimmer: wide soft-edged highlight, masked to the mark,
             with a rest phase (55%,100%) so the sweep breathes rather than
             strobes. */
          #loading-shell .st-boot-mark::after {
            content: ''; position: absolute; inset: -8%;
            background: linear-gradient(115deg,transparent 32%,rgba(255,255,255,0.55) 46%,rgba(255,255,255,0.75) 50%,rgba(255,255,255,0.55) 54%,transparent 68%);
            background-size: 260% 100%;
            -webkit-mask: url('/favicon.svg') center/contain no-repeat; mask: url('/favicon.svg') center/contain no-repeat;
            animation: st-shine 2.6s cubic-bezier(0.4,0,0.2,1) infinite;
          }
          html.dark #loading-shell .st-boot-mark::after {
            background-image: linear-gradient(115deg,transparent 32%,rgba(255,255,255,0.35) 46%,rgba(255,255,255,0.5) 50%,rgba(255,255,255,0.35) 54%,transparent 68%);
          }
          /* The wordmark carries the SAME sweep, clipped to the text — one
             motion, two surfaces, unmistakably branded. */
          .st-boot-word {
            font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
            background-image: linear-gradient(110deg, currentColor 38%, #f06413 49%, currentColor 60%);
            background-size: 260% 100%;
            background-position: 135% 0;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
            animation: st-shine 2.6s cubic-bezier(0.4,0,0.2,1) infinite;
          }
          html.dark #loading-shell .st-boot-word {
            background-image: linear-gradient(110deg, currentColor 38%, #fb9243 49%, currentColor 60%);
          }
          @media (prefers-reduced-motion: reduce) {
            .st-logo-breathe, .st-boot-word { animation: none; }
            #loading-shell .st-boot-mark::after { animation: none; opacity: 0; }
          }
          /* Class-driven, not media-driven: the theme script above already
             set html.dark for a manual choice, so the shell matches the
             saved theme instantly — no light flash in dark mode. */
          #loading-shell { background: #f7f4ee; }
          #loading-shell svg { color: #f06413; }
          #loading-shell p { color: #635f57; }
          #loading-shell .st-brand { color: #1e1c18; }
          html.dark #loading-shell { background: #131315; }
          html.dark #loading-shell svg { color: #fb9243; }
          html.dark #loading-shell p { color: #a5a19a; }
          html.dark #loading-shell .st-brand { color: #f2f0eb; }
        </style>
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px">
          <div style="position:relative" class="st-logo-breathe st-boot-mark">
            <svg width="54" height="54" viewBox="0 0 256 256" fill="none" aria-hidden="true">
              <rect x="40" y="36" width="84" height="84" rx="24" fill="currentColor"/><rect x="132" y="136" width="84" height="84" rx="24" fill="currentColor"/><path d="M110 106 L146 142" stroke="currentColor" stroke-width="28" stroke-linecap="round"/>
            </svg>
          </div>
          <span aria-hidden="true" class="st-boot-word">ShareTexts</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
