<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary -->
    <title>ShareText — AirDrop for every device. No app. No account.</title>
    <meta name="description" content="Share anything between two devices — text, photos, videos, files up to 4 GB. No app, no account, nothing stored. Open ShareText on both devices, connect with a code or link, done. iPhone to Windows included." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="ShareText" />
    <meta name="application-name" content="ShareText" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060a13" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShareText" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShareText" />
    <meta property="og:title" content="ShareText — Move something between your devices" />
    <meta property="og:description" content="No app. No account. Nothing stored. Text, photos, videos and files up to 4 GB — straight from one screen to the other, iPhone to Windows." />
    <meta property="og:url" content="https://share-texts.vercel.app/" />
    <!-- BRAND-NEW FILE NAME (og-3.png), not a query string: social crawlers
         (Twitter/X especially) cache cards by URL and often ignore ?v= bumps,
         which is why the old card kept showing. A fresh path forces a fresh
         crawl. The card is a live frame of the hero animation — a phone
         sending a photo, a laptop receiving it. -->
    <meta property="og:image" content="https://share-texts.vercel.app/og-3.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="ShareText — a phone sends a photo, a laptop receives it. No app, no account." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShareText — Move something between your devices" />
    <meta name="twitter:description" content="No app. No account. Nothing stored. Text, photos, videos, files up to 4 GB — iPhone to Windows, phone to laptop, in seconds." />
    <meta name="twitter:image" content="https://share-texts.vercel.app/og-3.png" />
    <meta name="twitter:image:alt" content="ShareText — a phone sends a photo, a laptop receives it. No app, no account." />

    <link rel="canonical" href="https://share-texts.vercel.app/" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ShareText",
      "url": "https://share-texts.vercel.app/",
      "description": "Share anything between two devices — no app, no account, nothing stored.",
      "applicationCategory": "UtilityApplication",
      "operatingSystem": "Any (browser with WebRTC)",
      "browserRequirements": "Requires WebRTC",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I move text between two devices with ShareText?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open ShareText on both devices. On the first device tap Send text and share the six-digit code (or a link). Enter the code on the second device, then paste or type anything — it appears on the other device, encrypted."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to install an app or create an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. ShareText runs in the browser — no app, no account, no installation. It works between an iPhone and a Windows PC, or any two devices with a browser."
          }
        },
        {
          "@type": "Question",
          "name": "Can I send photos and files, not just text?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. ShareText transfers text, links, photos, videos, audio, and files up to 4 GB directly between your devices, in original quality."
          }
        },
        {
          "@type": "Question",
          "name": "Is ShareText private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Transfers are encrypted between devices. ShareText keeps no account, no permanent chat history, and no copies of your content — temporary rooms close automatically."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
