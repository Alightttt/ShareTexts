<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary -->
    <title>ShareTexts — Transfer text and files between devices in your browser</title>
    <meta name="description" content="Move text, links, photos, and files between two devices. No app or account needed. Pair with a short code and transfer through a temporary browser session." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="ShareTexts" />
    <meta name="application-name" content="ShareTexts" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060a13" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShareTexts" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShareTexts" />
    <meta property="og:title" content="ShareTexts — Transfer text and files between devices in your browser" />
    <meta property="og:description" content="Move text, links, photos, and files between two devices. No app or account. Pair with a short code and transfer through a temporary browser session." />
    <meta property="og:url" content="https://share-texts.vercel.app/" />
    <meta property="og:image" content="https://share-texts.vercel.app/og.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:alt" content="ShareTexts — transfer a photo from a phone to a laptop in the browser. No app, no account." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShareTexts — Transfer text and files between devices in your browser" />
    <meta name="twitter:description" content="Move text, links, photos, and files between two devices. No app or account. Pair with a short code and transfer through a temporary browser session." />
    <meta name="twitter:image" content="https://share-texts.vercel.app/og.svg" />
    <meta name="twitter:image:alt" content="ShareTexts — transfer a photo from a phone to a laptop in the browser. No app, no account." />

    <link rel="canonical" href="https://share-texts.vercel.app/" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Structured data: Organization + WebApplication graph -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://share-texts.vercel.app/#organization",
          "name": "ShareTexts",
          "url": "https://share-texts.vercel.app/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://share-texts.vercel.app/icon-512.png",
            "width": 512,
            "height": 512
          }
        },
        {
          "@type": "WebApplication",
          "@id": "https://share-texts.vercel.app/#application",
          "name": "ShareTexts",
          "url": "https://share-texts.vercel.app/",
          "description": "A browser-based way to transfer text, links, photos, and files between two devices. No app or account needed.",
          "applicationCategory": "UtilitiesApplication",
          "operatingSystem": "Any modern browser with WebRTC support",
          "browserRequirements": "Requires a supported browser and an internet connection",
          "isAccessibleForFree": true,
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "publisher": {
            "@id": "https://share-texts.vercel.app/#organization"
          }
        }
      ]
    }
    </script>
    <!-- FAQPage markup — kept for content clarity; Google limits rich results to
         authoritative government/health sites, so this is not a ranking lever. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I move text between two devices with ShareTexts?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open ShareTexts on both devices. On the first device tap Send something and share the six-digit code or a link. Enter the code on the second device, then paste or type anything — it appears on the other device, encrypted."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to install an app or create an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. ShareTexts runs in the browser — no app, no account, no installation. It works between an iPhone and a Windows PC, or any two devices with a browser."
          }
        },
        {
          "@type": "Question",
          "name": "Can I send photos and files, not just text?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. ShareTexts transfers text, links, photos, videos, audio, and files between your devices. Tested transfer sizes vary by browser and connection."
          }
        },
        {
          "@type": "Question",
          "name": "Is ShareTexts private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Transfers are encrypted between devices. ShareTexts keeps no account, no permanent chat history, and no copies of your content. Temporary rooms close automatically."
          }
        }
      ]
    }
    </script>
    <!-- Apply the saved theme before first paint (no flash): default to the
         system preference; a manual choice in localStorage wins. The same
         logic lives in src/lib/theme.ts for runtime changes. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('sharetext.theme');
          var dark = v === 'dark' || (v !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? '#060a13' : '#ffffff';
        } catch (e) { /* storage unavailable — system default applies */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
