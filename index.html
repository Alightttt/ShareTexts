<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary -->
    <title>ShareText — Move anything between your devices</title>
    <meta name="description" content="Move text, links, photos, and files between any two devices. No app, no account. Open it on both screens, pair, send — done. Temporary by design." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="ShareText" />
    <meta name="application-name" content="ShareText" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060a13" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShareText" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShareText" />
    <meta property="og:title" content="ShareText — Move anything between your devices" />
    <meta property="og:description" content="Move text, links, photos, and files between any two devices. No app, no account. Pair, send, done. Temporary by design." />
    <meta property="og:url" content="https://sharetexts.online/" />
    <meta property="og:image" content="https://sharetexts.online/og/sharetext-og-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="ShareText — transfer a photo from a phone to a laptop in the browser. No app, no account." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShareText — Move anything between your devices" />
    <meta name="twitter:description" content="Move text, links, photos, and files between any two devices. No app, no account. Pair, send, done. Temporary by design." />
    <meta name="twitter:image" content="https://sharetexts.online/og/sharetext-og-v2.png" />
    <meta name="twitter:image:alt" content="ShareText — transfer a photo from a phone to a laptop in the browser. No app, no account." />

    <link rel="canonical" href="https://sharetexts.online/" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Structured data: Organization + WebApplication graph -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://sharetexts.online/#organization",
          "name": "ShareText",
          "url": "https://sharetexts.online/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://sharetexts.online/icon-512.png",
            "width": 512,
            "height": 512
          }
        },
        {
          "@type": "WebApplication",
          "@id": "https://sharetexts.online/#application",
          "name": "ShareText",
          "url": "https://sharetexts.online/",
          "description": "Move text, links, photos, and files between any two devices. No app, no account. Pair, send, done. Temporary by design.",
          "applicationCategory": "UtilitiesApplication",
          "operatingSystem": "Any modern browser with WebRTC support",
          "browserRequirements": "Requires a supported browser and an internet connection",
          "isAccessibleForFree": true,
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "publisher": {
            "@id": "https://sharetexts.online/#organization"
          }
        }
      ]
    }
    </script>
    <!-- FAQPage markup — kept for content clarity; Google limits rich results to
         authoritative government/health sites, so this is not a ranking lever. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I move text between two devices?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open ShareText on both devices. On the first device, tap Send and share the six-digit code. Enter the code on the second device, then paste or type anything — it appears on the other device, encrypted."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to install an app or create an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. ShareText runs in the browser — no app, no account, no installation. It works between an iPhone and a Windows PC, or any two devices with a browser."
          }
        },
        {
          "@type": "Question",
          "name": "Can I send photos and files, not just text?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. ShareText transfers text, links, photos, videos, audio, and files between your devices. Tested transfer sizes vary by browser and connection."
          }
        },
        {
          "@type": "Question",
          "name": "Is ShareText private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Transfers are encrypted between devices. ShareText keeps no account, no permanent chat history, and no copies of your content. Temporary rooms close automatically."
          }
        }
      ]
    }
    </script>
    <!-- Apply the saved theme before first paint (no flash): default to the
         system preference; a manual choice in localStorage wins. The same
         logic lives in src/lib/theme.ts for runtime changes. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('sharetext.theme');
          var dark = v === 'dark' || (v !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? '#060a13' : '#ffffff';
        } catch (e) { /* storage unavailable — system default applies */ }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Loading state: shown while JS loads, replaced by React -->
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#060a13;">
        <div style="text-align:center;">
          <svg width="48" height="48" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" style="animation:pulse 2s ease-in-out infinite;">
            <rect x="40" y="36" width="84" height="84" rx="24" fill="#0a66f0"/>
            <rect x="132" y="136" width="84" height="84" rx="24" fill="#0a66f0"/>
            <path d="M110 106 L146 142" stroke="#0a66f0" stroke-width="28" stroke-linecap="round"/>
          </svg>
          <p style="color:#7a7a7a;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;margin-top:16px;">Loading ShareText…</p>
        </div>
      </div>
      <style>@keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
