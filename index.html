    <!-- Primary -->
    <title>ShareText — Move something between your devices</title>
    <meta name="description" content="Move text, photos and files from your phone to your computer (or any two devices) in seconds — iPhone to Windows included. No app, no account, nothing to install. Open ShareText on two devices, connect, transfer, done." />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ShareText",
      "url": "https://share-texts.vercel.app/",
      "description": "Move text, photos and files between your devices — no app, no account, nothing to install.",
      "applicationCategory": "UtilityApplication",
      "operatingSystem": "Any (browser with WebRTC)",
      "browserRequirements": "Requires WebRTC",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I move text between two devices with ShareText?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open ShareText on both devices. On the first device tap Create Session and share the six-digit code (or a link). Enter the code on the second device, then paste or type anything — it appears on the other device, encrypted."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to install an app or create an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. ShareText runs in the browser — no app, no account, no installation. It works between an iPhone and a Windows PC, or any two devices with a browser."
          }
        },
        {
          "@type": "Question",
          "name": "Can I send photos and files, not just text?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. ShareText transfers text, links, photos, videos, audio, and files up to 200 MB directly between your devices."
          }
        },
        {
          "@type": "Question",
          "name": "Is ShareText private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Transfers are encrypted between devices. ShareText keeps no account, no permanent chat history, and no copies of your content — temporary rooms close automatically."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
