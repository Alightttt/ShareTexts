<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary -->
    <title>ShareText: move anything between two devices</title>
    <meta name="description" content="Send text, photos, and files between any two devices, phone to laptop, iPhone to Windows, straight from your browser. No app, no account, nothing to install. Rooms close when you're done." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="ShareText" />
    <meta name="application-name" content="ShareText" />
    <meta name="theme-color" content="#f6f0e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#120e22" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShareText" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShareText" />
    <meta property="og:title" content="ShareText: move anything between two devices" />
    <meta property="og:description" content="Send text, photos, and files between any two devices, phone to laptop, iPhone to Windows, straight from your browser. No app, no account, nothing to install." />
    <meta property="og:url" content="https://sharetexts.online/" />
    <meta property="og:image" content="https://sharetexts.online/og/sharetext-og-v7.png?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="ShareText — move anything between your devices" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShareText: move anything between two devices" />
    <meta name="twitter:description" content="Send text, photos, and files between any two devices, phone to laptop, iPhone to Windows, straight from your browser. No app, no account, nothing to install." />
    <meta name="twitter:image" content="https://sharetexts.online/og/sharetext-og-v7.png?v=1" />
    <meta name="twitter:image:alt" content="ShareText — move anything between your devices" />

    <link rel="canonical" href="https://sharetexts.online/" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=11" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=11" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=11" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=12" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=12" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=12" />

    <!-- Structured data: Organization + WebApplication graph -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://sharetexts.online/#organization",
          "name": "ShareText",
          "url": "https://sharetexts.online/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://sharetexts.online/icon-512.png",
            "width": 512,
            "height": 512
          }
        },
        {
          "@type": "WebApplication",
          "@id": "https://sharetexts.online/#application",
          "name": "ShareText",
          "url": "https://sharetexts.online/",
          "description": "Move text, links, photos, and files between any two devices. No app, no account. Pair, send, done. Nothing is kept.",
          "applicationCategory": "UtilitiesApplication",
          "operatingSystem": "Any modern browser with WebRTC support",
          "browserRequirements": "Requires a supported browser and an internet connection",
          "isAccessibleForFree": true,
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "publisher": {
            "@id": "https://sharetexts.online/#organization"
          }
        }
      ]
    }
    </script>
    <!-- FAQPage markup — kept for content clarity; Google limits rich results to
         authoritative government/health sites, so this is not a ranking lever. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I move text between two devices?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open ShareText on both devices. On the first device, tap Send and share the six-digit code. Enter the code on the second device, then paste or type anything — it appears on the other device, encrypted."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to install an app or create an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. ShareText runs in the browser — no app, no account, no installation. It works between an iPhone and a Windows PC, or any two devices with a browser."
          }
        },
        {
          "@type": "Question",
          "name": "Can I send photos and files, not just text?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. ShareText transfers text, links, photos, videos, audio, and files between your devices. Tested transfer sizes vary by browser and connection."
          }
        },
        {
          "@type": "Question",
          "name": "Is ShareText private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Transfers are encrypted between devices. ShareText keeps no account, no permanent chat history, and no copies of your content. Temporary rooms close automatically."
          }
        }
      ]
    }
    </script>
    <!-- Apply the saved theme before first paint (no flash): default to the
         system preference; a manual choice in localStorage wins. The same
         logic lives in src/lib/theme.ts for runtime changes. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('sharetext.theme');
          var dark = v === 'dark' || (v !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? '#120e22' : '#f6f0e6';
        } catch (e) { /* storage unavailable — system default applies */ }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f3f0;color:#1d1d1f">
          <div style="text-align:center;padding:2rem">
            <svg width="40" height="40" viewBox="0 0 256 256" fill="none" style="margin-bottom:1rem">
              <rect x="40" y="36" width="84" height="84" rx="24" fill="currentColor"/><rect x="132" y="136" width="84" height="84" rx="24" fill="currentColor"/><path d="M110 106 L146 142" stroke="currentColor" stroke-width="28" stroke-linecap="round"/>
            </svg>
            <p style="font-size:16px;font-weight:600;margin:0 0 8px">ShareText requires JavaScript.</p>
            <p style="font-size:14px;color:#6e6e73;margin:0">Please enable JavaScript in your browser settings.</p>
          </div>
        </div>
      </noscript>
      <div id="loading-shell" style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;transition:opacity 0.3s ease">
        <style>
          #loading-shell { opacity: 1; }
          #loading-shell.fade-out { opacity: 0; }
          .st-logo-pulse { animation: st-pulse 2s ease-in-out infinite; }
          @keyframes st-pulse { 0%,100%{opacity:0.6;transform:scale(1)} 50%{opacity:1;transform:scale(1.03)} }
          @media (prefers-color-scheme: dark) { #loading-shell { background: #141024; } #loading-shell svg { color: #a78bfa; } #loading-shell p { color: #ab9e8f; } #loading-shell .st-brand { color: #f4eee2; } }
          @media (prefers-color-scheme: light) { #loading-shell { background: #f6f0e6; } #loading-shell svg { color: #8b7cf6; } #loading-shell p { color: #6f665a; } #loading-shell .st-brand { color: #241d14; } }
        </style>
        <div style="text-align:center">
          <svg class="st-logo-pulse" width="40" height="40" viewBox="0 0 256 256" fill="none" style="margin-bottom:14px;color:#8b7cf6">
            <rect x="40" y="36" width="84" height="84" rx="24" fill="currentColor"/><rect x="132" y="136" width="84" height="84" rx="24" fill="currentColor"/><path d="M110 106 L146 142" stroke="currentColor" stroke-width="28" stroke-linecap="round"/>
          </svg>
          <p class="st-brand" style="font-size:15px;font-weight:600;margin:0 0 4px;letter-spacing:-0.02em;color:#1d1d1f">ShareText</p>
          <p style="font-size:13px;margin:0;color:#6e6e73">Loading...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
