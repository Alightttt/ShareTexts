<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0F1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1769FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4C8DFF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle dot grid -->
  <g opacity="0.15">
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="white"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>
  
  <!-- Phone (left) -->
  <g transform="translate(280, 140)">
    <!-- Phone body -->
    <rect x="0" y="0" width="140" height="280" rx="20" fill="#1A1D23" stroke="#2A2D35" stroke-width="2"/>
    <!-- Screen -->
    <rect x="8" y="28" width="124" height="224" rx="4" fill="#0D0F14"/>
    <!-- Notch -->
    <rect x="40" y="8" width="60" height="16" rx="8" fill="#2A2D35"/>
    <!-- Screen content - ShareText logo -->
    <g transform="translate(55, 100)">
      <circle cx="15" cy="15" r="18" fill="url(#blue)"/>
      <path d="M8 15 L15 8 L22 15 L15 22 Z" fill="white" opacity="0.9"/>
    </g>
    <!-- Status bar -->
    <text x="70" y="50" fill="#4C8DFF" font-family="system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle">Connected</text>
    <!-- Transfer chip -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="100" height="32" rx="8" fill="#1A1D23" stroke="#2A2D35" stroke-width="1"/>
      <rect x="8" y="8" width="16" height="16" rx="4" fill="#1769FF" opacity="0.2"/>
      <text x="32" y="13" fill="#F5F7FA" font-family="system-ui, sans-serif" font-size="8" font-weight="500">photo.jpg</text>
      <text x="32" y="24" fill="#9AA3B2" font-family="system-ui, sans-serif" font-size="7">18.4 MB</text>
    </g>
  </g>
  
  <!-- Laptop (right) -->
  <g transform="translate(780, 180)">
    <!-- Screen -->
    <rect x="0" y="0" width="320" height="200" rx="12" fill="#1A1D23" stroke="#2A2D35" stroke-width="2"/>
    <!-- Screen content -->
    <rect x="8" y="24" width="304" height="168" rx="4" fill="#0D0F14"/>
    <!-- Camera dot -->
    <circle cx="160" cy="12" r="3" fill="#2A2D35"/>
    <!-- Screen content - received file -->
    <g transform="translate(40, 50)">
      <rect x="0" y="0" width="240" height="60" rx="10" fill="#1A1D23" stroke="#2A2D35" stroke-width="1"/>
      <rect x="12" y="12" width="36" height="36" rx="8" fill="#1769FF" opacity="0.2"/>
      <text x="60" y="28" fill="#F5F7FA" font-family="system-ui, sans-serif" font-size="11" font-weight="500">photo.jpg</text>
      <text x="60" y="42" fill="#9AA3B2" font-family="system-ui, sans-serif" font-size="9">18.4 MB · Received</text>
      <rect x="180" y="16" width="50" height="28" rx="14" fill="#1769FF"/>
      <text x="205" y="34" fill="white" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Save</text>
    </g>
    <!-- Status -->
    <text x="160" y="140" fill="#46C78A" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">● Received</text>
    <!-- Base -->
    <rect x="-10" y="200" width="340" height="12" rx="2" fill="#2A2D35"/>
    <rect x="120" y="200" width="80" height="3" rx="1.5" fill="#3A3D45"/>
  </g>
  
  <!-- Bridge connection -->
  <g filter="url(#glow)">
    <!-- Connection line -->
    <line x1="420" y1="280" x2="780" y2="280" stroke="url(#blue)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Transfer packet -->
    <circle cx="600" cy="280" r="8" fill="#1769FF"/>
    <circle cx="600" cy="280" r="4" fill="white"/>
  </g>
  
  <!-- ShareText logo (center) -->
  <g transform="translate(580, 260)">
    <circle cx="20" cy="20" r="22" fill="#0D0F14" stroke="#2A2D35" stroke-width="2"/>
    <circle cx="20" cy="20" r="16" fill="url(#blue)"/>
    <path d="M12 20 L20 12 L28 20 L20 28 Z" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="380" fill="#F5F7FA" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" text-anchor="middle" letter-spacing="-1">ShareText</text>
  <text x="600" y="420" fill="#9AA3B2" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" text-anchor="middle">Move anything between your devices</text>
  <text x="600" y="450" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">No app · No account · Temporary by design</text>
  
  <!-- Bottom accent line -->
  <rect x="500" y="480" width="200" height="3" rx="1.5" fill="url(#blue)" opacity="0.5"/>
</svg>
