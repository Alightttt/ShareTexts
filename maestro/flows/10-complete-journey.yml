# ShareText E2E Test: Single-Device Journey
# The panels a single device can drive: home → sender panel → back →
# receiver panel → back. (Two-device transfer E2E lives in scripts/e2e.mjs.)
url: http://localhost:3000
tags:
  - complete
  - journey
  - e2e
---
- launchApp:
    clearState: true

# Home
- assertVisible:
    text: "Move anything"
- assertVisible:
    text: "Send"
- assertVisible:
    text: "Receive"

# Start a session (sender panel)
- tapOn:
    text: "Send"
- assertVisible:
    text: "Connect your other device."
- assertVisible:
    text: "Copy code"

# Cancel back to home
- tapOn:
    text: "Cancel"
- assertVisible:
    text: "Move anything"

# Open the receiver panel
- tapOn:
    text: "Receive"
- assertVisible:
    text: "Join a room."
- assertVisible:
    text: "Scan QR code"

# Cancel back to home
- tapOn:
    text: "Cancel"
- assertVisible:
    text: "Move anything"

# Take final screenshot
- takeScreenshot: complete-journey
