# ShareText E2E Test: Text Transfer
# Tests sending and receiving text
# NOTE: Requires two devices connected
url: http://localhost:3000
tags:
  - transfer
  - text
  - e2e
---
# This flow tests the text transfer experience
# In a real test environment, you would:
# 1. Create a session on Device A
# 2. Join the session on Device B
# 3. Send text from Device A
# 4. Verify receipt on Device B

# Steps for Device A (sender):
- launchApp:
    clearState: true

# Type text in composer
- tapOn:
    text: "Paste or type something…"
- inputText: "Hello from ShareText E2E test!"

# Send button should be enabled
- assertVisible:
    text: "↑"

# Click send
- tapOn:
    text: "↑"

# Text should appear in the transfer stream
- assertVisible:
    text: "Hello from ShareText E2E test!"

# Status should show Delivered or Seen
- assertVisible:
    text: "Delivered"

# Take screenshot
- takeScreenshot: text-sent
