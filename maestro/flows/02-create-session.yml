# ShareText E2E Test: Create Session (sender panel)
# Tests starting a session from the home screen: the sending panel shows the
# pairing-code tile group with the share/copy/QR actions.
url: http://localhost:3000
tags:
  - session
  - create
  - smoke
---
- launchApp:
    clearState: true

# Start a session
- tapOn:
    text: "Send"

# Sending panel heading
- assertVisible:
    text: "Connect your other device."

# Sharing affordances
- assertVisible:
    text: "Show QR"
- assertVisible:
    text: "Share link"
- assertVisible:
    text: "Copy code"

# Escape hatch back to home
- assertVisible:
    text: "Cancel"

# Take screenshot
- takeScreenshot: session-created
