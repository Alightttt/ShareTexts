# ShareText E2E Test: Responsive Design
# Tests the app at different viewport sizes
url: http://localhost:3000
tags:
  - responsive
  - mobile
  - desktop
---
# Test mobile viewport (375px)
- launchApp:
    clearState: true

# Verify mobile layout
- assertVisible:
    text: "Move anything between your devices"

# Take mobile screenshot
- takeScreenshot: mobile-landing

# Test tablet viewport (768px)
# Maestro currently has preset viewports, but we can test the landing page
# at different sizes by checking key elements remain visible

# Verify CTA is always accessible
- assertVisible:
    text: "Send text"

# Verify hero text is readable
- assertVisible:
    text: "No app. No account."

# Take screenshot
- takeScreenshot: responsive-landing
