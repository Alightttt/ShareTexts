# ShareText E2E Test: 404 Page
# Unknown paths render the not-found screen with a route back home.
url: http://localhost:3000/definitely-not-a-real-page
tags:
  - 404
  - navigation
---
- launchApp:
    clearState: true

# Styled not-found message
- assertVisible:
    text: "This page does not exist."

# Return home
- tapOn:
    text: "Go Home"

# Home hero renders
- assertVisible:
    text: "Move anything"

# Take screenshot
- takeScreenshot: 404-page
