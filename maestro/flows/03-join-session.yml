# ShareText E2E Test: Join Session (receiver panel)
# Verifies the code-entry receiving panel reached via the Receive action.
url: http://localhost:3000
tags:
  - session
  - join
  - smoke
---
- launchApp:
    clearState: true

# Open the receiver panel
- tapOn:
    text: "Receive"

# Receiving panel heading + helper copy
- assertVisible:
    text: "Join a room."
- assertVisible:
    text: "Enter the code shown on the other device."

# Camera + privacy affordances
- assertVisible:
    text: "Scan QR code"
- assertVisible:
    text: "Encrypted between devices. Temporary by design."

# Escape hatch back to home
- assertVisible:
    text: "Cancel"

# Take screenshot
- takeScreenshot: join-session
