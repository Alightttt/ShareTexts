# ShareText E2E Test: Error States — invalid pairing code
# Entering a code that matches no active room shows the rejection message on
# the receiver panel. The code input autofocuses, so typing needs no tap.
url: http://localhost:3000
tags:
  - error
  - edge-case
---
- launchApp:
    clearState: true

# Open the receiver panel
- tapOn:
    text: "Receive"

# Type a code that cannot belong to an active room
- inputText: "000000"

# The join error is surfaced under the code entry, with a retry affordance
- assertVisible:
    text: "isn't active"
- assertVisible:
    text: "Try again"

# Take screenshot
- takeScreenshot: invalid-code-error
